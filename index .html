<!DOCTYPE html>
<html lang="pt">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MOZ SOCIAL</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f0f2f5;
        }

        header {
            background: #008000;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .conteudo {
            padding: 20px;
            text-align: center;
        }

        button {
            padding: 12px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        textarea {
            width: 90%;
            height: 100px;
            padding: 10px;
        }

        input {
            margin: 10px;
        }

        #areaPublicacao {
            margin-top: 20px;
        }

        img, video {
            max-width: 100%;
            margin-top: 10px;
            border-radius: 10px;
        }

        .post {
            background: white;
            padding: 15px;
            margin-top: 15px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <header>
        <h1>MOZ SOCIAL 🇲🇿</h1>
        <p>A tua rede social</p>
    </header>

    <div class="conteudo">

        <h2>Bem-vindo à MOZ SOCIAL!</h2>

        <button>🏠 Início</button>

        <button onclick="publicar()">➕ Publicar</button>

        <button>👤 Perfil</button>

        <div id="areaPublicacao"></div>

        <div id="publicacoes"></div>

    </div>

    <script>

        function publicar() {

            document.getElementById("areaPublicacao").innerHTML = `

                <div>

                    <h2>Nova publicação</h2>

                    <textarea id="textoPublicacao"
                    placeholder="Escreve a tua publicação..."></textarea>

                    <br>

                    <input type="file" id="ficheiro"
                    accept="image/*,video/*">

                    <br>

                    <button onclick="enviarPublicacao()">
                        📤 Publicar
                    </button>

                </div>

            `;
        }

        function enviarPublicacao() {

            let texto = document.getElementById("textoPublicacao").value;

            let ficheiro = document.getElementById("ficheiro").files[0];

            if (texto.trim() === "" && !ficheiro) {

                alert("Escreve um texto ou escolhe uma foto/vídeo!");

                return;

            }

            let post = document.createElement("div");

            post.className = "post";

            if (texto.trim() !== "") {

                let paragrafo = document.createElement("p");

                paragrafo.textContent = texto;

                post.appendChild(paragrafo);

            }

            if (ficheiro) {

                let url = URL.createObjectURL(ficheiro);

                if (ficheiro.type.startsWith("image/")) {

                    let imagem = document.createElement("img");

                    imagem.src = url;

                    post.appendChild(imagem);

                }

                else if (ficheiro.type.startsWith("video/")) {

                    let video = document.createElement("video");

                    video.src = url;

                    video.controls = true;

                    post.appendChild(video);

                }

            }

            document.getElementById("publicacoes").prepend(post);

            document.getElementById("areaPublicacao").innerHTML = "";

            alert("Publicação feita com sucesso! 🇲🇿");

        }

    </script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js");
}
</script></body>
</html>
